id: positive-followup
title: User follow-up survives dropped acceptance and restart
cites:
- 'Positive: owner-created follow-up in the original DM'
settings: {}
arms:
- ref: task
  command: add in 10m Follow up on the report
timeline:
- t: 0
  event: injector
  mode: drop
- t: 660
  event: restart
- t: 690
  event: injector
  mode: ok
model_policy:
  default:
  - outcome: done
    notify: true
    summary: Task is complete.
duration: 1500
expectations:
  required_fires:
  - wake: task
    # Due at 600 and accepted but dropped. The restart at 660 re-submits at once (an
    # owner one-time reminder is not held by wake spacing), into the injector that
    # still drops until 690. The 600 s acknowledgement timeout then refunds it at 1260.
    window:
    - 1260
    - 1290
  forbidden_deliveries: []
  bars:
    task:
      deliveries: 1
heartbeat_checklist:
- ref: task
  session: owner
  note: add in 10m Follow up on the report
baseline_interval_s: 600
